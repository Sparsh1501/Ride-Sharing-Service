server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: ride-request
          uri: ${RIDE_REQUEST_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/rides/**
        - id: dispatch
          uri: ${DISPATCH_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/dispatch/**
        - id: driver-location
          uri: ${DRIVER_LOCATION_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/drivers/*/location, /api/v1/drivers/*/register, /api/v1/drivers/*/status, /api/v1/drivers/*/state, /api/v1/drivers/nearby
        - id: trip
          uri: ${TRIP_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/trips/**, /api/v1/eta
        - id: surge
          uri: ${SURGE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/surge/**
        - id: notification-offer
          uri: ${NOTIFICATION_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/drivers/*/ride-offer/**, /api/v1/auth/**
        - id: notification-ws
          uri: ${NOTIFICATION_URL:http://localhost:8086}
          predicates:
            - Path=/ws/**
        - id: query
          uri: ${QUERY_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/riders/**, /api/v1/analytics/**, /api/v1/admin/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      service: api-gateway
