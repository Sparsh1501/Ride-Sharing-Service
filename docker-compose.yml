services:
  # ---------------------------------------------------------------- infra
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dispatch}
      POSTGRES_USER: ${POSTGRES_USER:-dispatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dispatch}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dispatch}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  # ---------------------------------------------------------------- services
  api-gateway:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: api-gateway } }
    container_name: api-gateway
    depends_on: [ride-request-service, dispatch-service, driver-location-service, trip-service, surge-pricing-service, notification-service, query-service]
    ports: ["8080:8080"]
    environment:
      RIDE_REQUEST_URL: http://ride-request-service:8081
      DISPATCH_URL: http://dispatch-service:8082
      DRIVER_LOCATION_URL: http://driver-location-service:8083
      TRIP_URL: http://trip-service:8084
      SURGE_URL: http://surge-pricing-service:8085
      NOTIFICATION_URL: http://notification-service:8086
      QUERY_URL: http://query-service:8087

  ride-request-service:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: ride-request-service } }
    container_name: ride-request-service
    depends_on: [kafka]
    ports: ["${RIDE_REQUEST_PORT:-8081}:8081"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      SURGE_URL: http://surge-pricing-service:8085

  dispatch-service:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: dispatch-service } }
    container_name: dispatch-service
    depends_on: [kafka, redis]
    ports: ["8082:8082"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_HOST: redis
      HOSTNAME: dispatch-1

  driver-location-service:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: driver-location-service } }
    container_name: driver-location-service
    depends_on: [kafka, redis]
    ports: ["8083:8083"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_HOST: redis

  trip-service:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: trip-service } }
    container_name: trip-service
    depends_on:
      kafka: { condition: service_started }
      redis: { condition: service_started }
      postgres: { condition: service_healthy }
    ports: ["8084:8084"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-dispatch}
      POSTGRES_USER: ${POSTGRES_USER:-dispatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dispatch}

  surge-pricing-service:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: surge-pricing-service } }
    container_name: surge-pricing-service
    depends_on: [kafka, redis]
    ports: ["8085:8085"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_HOST: redis

  notification-service:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: notification-service } }
    container_name: notification-service
    depends_on: [kafka, redis]
    ports: ["8086:8086"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-dispatch-engine-dev-secret-key-please-change-1234567890}

  query-service:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: query-service } }
    container_name: query-service
    depends_on:
      kafka: { condition: service_started }
      redis: { condition: service_started }
      postgres: { condition: service_healthy }
    ports: ["8087:8087"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-dispatch}
      POSTGRES_USER: ${POSTGRES_USER:-dispatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dispatch}

  # ---------------------------------------------------------------- observability
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    depends_on: [prometheus]
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  pgdata:
  redisdata:
