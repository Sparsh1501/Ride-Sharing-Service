name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run all tests
        run: ./gradlew test integrationTest --no-daemon

      - name: Publish test report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 14

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build application
        run: |
          ./gradlew bootJar --no-daemon -x test
          echo "BOOT_JAR=$(ls build/libs/*.jar | grep -v -- '-plain' | head -1)" >> "$GITHUB_ENV"

      - name: Upload boot JAR
        uses: actions/upload-artifact@v4
        with:
          name: boot-jar
          path: ${{ env.BOOT_JAR }}
          if-no-files-found: error
          retention-days: 7

  dockerize:
    name: Dockerize
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start infrastructure
        run: docker compose up -d zookeeper kafka postgres redis

      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U dispatch; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready in time"
          docker compose logs postgres
          exit 1

      - name: Build and start application container
        run: docker compose up -d --build dispatch-engine

      - name: Verify application startup
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            if curl -sf http://localhost:8080/actuator/health | tee health.json; then
              if grep -q '"status":"UP"' health.json; then
                echo "Application is healthy"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Application failed to report UP on /actuator/health"
          docker compose ps
          docker compose logs dispatch-engine --tail 200
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
