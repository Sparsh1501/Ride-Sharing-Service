global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'dispatch-engine'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'api-gateway:8080'
          - 'ride-request-service:8081'
          - 'dispatch-service:8082'
          - 'driver-location-service:8083'
          - 'trip-service:8084'
          - 'surge-pricing-service:8085'
          - 'notification-service:8086'
          - 'query-service:8087'
